<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mehar G Admin</title><meta name="robots" content="noindex"><link rel="manifest" href="/admin.webmanifest"><meta name="theme-color" content="#7a0c14"><link rel="icon" href="/admin-icon-192.png"><link rel="apple-touch-icon" href="/admin-icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MG Admin">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#f4efe0;color:#1d1512}
.top{background:#7a0c14;color:#ffd21f;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top b{font-size:18px}.wrap{max-width:820px;margin:auto;padding:12px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:10px;border:0;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}.tabs .on{background:#7a0c14;color:#ffd21f}
.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0}
input,select{font:inherit;padding:8px;border:1px solid #b9a98a;border-radius:6px;width:100%}
.btn{background:#7a0c14;color:#ffd21f;border:0;border-radius:8px;padding:10px 16px;font:700 16px system-ui;cursor:pointer}.btn.g{background:#e8e2d0;color:#1d1512}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}.row>*{flex:1;min-width:90px}.row label{flex:0 0 auto;min-width:0}
.lab{font-size:13px;color:#5a4a44}.st{display:inline-block;padding:2px 10px;border-radius:12px;background:#ffd21f;font-size:13px;font-weight:700}
.stat{display:flex;gap:10px}.stat div{flex:1;background:#fff;border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}
#msg{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;display:none}
#err{color:#b00020}:focus-visible{outline:3px solid #0057d8}
</style></head><body>
<div id="login" class="wrap" style="max-width:420px;margin-top:60px"><div class="card"><h2 style="margin-top:0">Mehar G Admin</h2>
<p class="lab">Enter the admin password to manage orders, prices and settings.</p>
<input id="pw" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')go()"><p id="err"></p><button class="btn" style="width:100%" onclick="go()">Log in</button></div></div>
<div id="app" style="display:none"><div class="top"><b>Mehar G Admin</b><span><button class="btn g" id="ins" style="display:none;margin-right:6px" onclick="inst()">📲 Install app</button><button class="btn g" onclick="out()">Log out</button></span></div>
<div class="wrap"><div class="tabs"><button id="t0" onclick="tab(0)">Orders</button><button id="t1" onclick="tab(1)">Menu</button><button id="t2" onclick="tab(2)">Settings</button></div>
<div id="v"></div><button class="btn" id="sv" style="width:100%;margin-top:10px;display:none;position:sticky;bottom:10px;z-index:4;box-shadow:0 4px 14px #0005" onclick="save()">Save changes</button></div></div>
<div id="msg" role="status"></div>
<script src="menu-data.js"></script>
<script>
const $=s=>document.getElementById(s),rs=n=>'Rs. '+Math.round(n).toLocaleString('en-US'),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let K=localStorage.mgk||'',D={s:{},o:{items:{},custom:[]}},T=0,OR=[],tm;
const api=(m,u,b)=>fetch(u,{method:m,headers:{'x-admin-key':K,'content-type':'application/json'},body:b?JSON.stringify(b):undefined});
const toast=t=>{const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',5000)};
async function go(){K=$('pw').value||K;try{const r=await api('GET','/api/orders');
 if(r.status==401){$('err').textContent='Wrong password. Try again.';return}
 if(!r.ok){$('err').textContent='Save server not found. Open this page from your Netlify site (/admin).';return}
 localStorage.mgk=K;const m=await(await fetch('/api/menu')).json();D={s:m.s||{},o:{items:{},custom:[],...(m.o||{})}};
 $('login').style.display='none';$('app').style.display='block';tab(0)}catch(e){$('err').textContent='No connection. Check your internet.'}}
function out(){localStorage.removeItem('mgk');location.reload()}
async function tab(n){T=n;clearInterval(tm);[0,1,2].forEach(i=>$('t'+i).className=i==n?'on':'');$('sv').style.display=n?'block':'none';
 if(n==0){await ords();tm=setInterval(ords,30000)}else n==1?menu():sets()}
async function ords(){const r=await api('GET','/api/orders');if(!r.ok)return;OR=(await r.json()).orders;if(T!=0)return;
 const d0=new Date().setHours(0,0,0,0),td=OR.filter(o=>o.t>=d0&&o.st!='cancelled');
 $('v').innerHTML=`<div class="stat"><div><b>${td.length}</b>Orders today</div><div><b>${rs(td.reduce((a,o)=>a+o.total,0))}</b>Sales today</div><div><b>${OR.filter(o=>o.st=='new').length}</b>New</div></div>`+
 (OR.length?OR.map(o=>`<div class="card"><div class="row"><b style="flex:2">${esc(o.name)} · ${esc(o.ph)}</b><span class="st" style="flex:0">${o.st}</span></div>
 <div class="lab">${new Date(o.t).toLocaleString()} · ${o.type}${o.type=='Delivery'?' · '+esc(o.ad):''}</div>
 <div>${o.lines.map(l=>`${l.q} x ${esc(l.n)}${l.l?' ('+esc(l.l)+')':''}`).join('<br>')}</div><b>${rs(o.total)}</b>
 <div class="row">${['preparing','delivered','cancelled'].filter(s=>s!=o.st).map(s=>`<button class="btn g" onclick="setst('${o.id}','${s}')">${s}</button>`).join('')}<a class="btn g" style="text-decoration:none;text-align:center" href="tel:${esc(o.ph)}">Call</a></div></div>`).join(''):'<div class="card">No orders yet. New orders appear here automatically.</div>')}
async function setst(id,s){const r=await api('PATCH','/api/orders?id='+id+'&st='+s);r.ok?(toast('Order '+s),ords()):toast('Could not update')}
const it=id=>D.o.items[id]=D.o.items[id]||{},cu=id=>D.o.custom.find(x=>x.id==id),bn=id=>(D.o.bn||[]).find(x=>x.id==id);
function ed(id,f,v,k){const c=cu(id);if(c){c[f]=(f=='p'||f=='dp')?Math.max(0,+v||0):v;return}const o=it(id);
 if(f=='dp'){o.dp=o.dp||[];o.dp[k]=Math.max(0,+v||0)}else if(f=='p'){const b=MENU.flatMap(c=>c.i).find(x=>x[0]==id);o.p=o.p||[...b[3]];o.p[k]=Math.max(0,+v||0)}else o[f]=v}
const SEC=()=>MENU.map(c=>({id:c.id,t:c.t,i:c.i,cs:0})).concat((D.o.sec||[]).map(s=>({id:s.id,t:s.t,i:[],cs:1})));
function menu(){const o0=D.o;o0.sec=o0.sec||[];o0.st=o0.st||{};o0.hs=o0.hs||{};const S=SEC();
 $('v').innerHTML=`<p class="lab">💡 Change name, details (what is included), price, discount and photo of any item. You can also remove items, hide or rename a section, and add new items or new sections. Press <b>Save changes</b> when done (photos save by themselves). Discount must be lower than the price; leave it empty to remove it.</p>
 ${bnCard()}<select aria-label="Jump to section" onchange="document.getElementById('sec_'+this.value).scrollIntoView({behavior:'smooth'})"><option value="">Jump to section...</option>${S.map(c=>`<option value="${c.id}">${esc(o0.st[c.id]||c.t)}</option>`).join('')}</select>`+
 S.map(c=>{const title=o0.st[c.id]||c.t,all=c.i.map(([id,n,d,p,z])=>({id,n,d,p,z,cu:0})).concat(o0.custom.filter(x=>x.c==c.id).map(x=>({id:x.id,n:x.n,d:x.d||'',p:[x.p],cu:1})));
  const live=all.filter(x=>x.cu||!(o0.items[x.id]||{}).rm),gone=all.filter(x=>!x.cu&&(o0.items[x.id]||{}).rm);
  return `<div class="card" id="sec_${c.id}"><div class="row" style="align-items:center"><input value="${esc(title)}" style="font-weight:700;flex:2" onchange="secT('${c.id}',this.value)" aria-label="Section name"><label><input type="checkbox" style="width:auto" ${o0.hs[c.id]?'checked':''} onchange="secH('${c.id}',this.checked)"> Hide section</label>${c.cs?`<button class="btn g" style="flex:0 0 auto" onclick="delsec('${c.id}')">Delete section</button>`:''}</div>`+
  live.map(x=>{const o=x.cu?cu(x.id):(o0.items[x.id]||{}),p=x.cu?[o.p]:(o.p||x.p),dv=o.d!==undefined?o.d:x.d;
   return `<div style="border-top:1px solid #eee;margin-top:8px;padding-top:8px"><input value="${esc(o.n||x.n)}" onchange="ed('${x.id}','n',this.value)" aria-label="Item name"><input style="margin-top:6px" placeholder="Details - what is included (shown to customers)" value="${esc(dv||'')}" onchange="ed('${x.id}','d',this.value)" aria-label="Details"><div class="row">${p.map((v,k)=>`<div style="flex:1;min-width:120px"><label class="lab" style="display:block">${x.z?SZ[x.z][k]:'Price'}<input type="number" min="0" value="${v}" onchange="ed('${x.id}','p',this.value,${k})"></label><label class="lab" style="display:block;color:#a8141f;margin-top:4px">Discount price<input type="number" min="0" placeholder="No discount" value="${(x.cu?o.dp:(o.dp||[])[k])||''}" onchange="ed('${x.id}','dp',this.value,${k})"></label></div>`).join('')}</div>
 <div class="row" style="align-items:center">${o.iv?`<img src="/api/img?id=${x.id}&v=${o.iv}" alt="" style="max-width:90px;border-radius:6px;flex:0 0 auto">`:'<span class="lab" style="flex:0 0 auto">Original photo</span>'}<label class="btn g" style="text-align:center;cursor:pointer;flex:0 0 auto">📷 Change photo<input type="file" accept="image/*" hidden onchange="pic('${x.id}',this)"></label>${o.iv?`<button class="btn g" style="flex:0 0 auto" onclick="unpic('${x.id}')">Reset photo</button>`:''}</div>
 <div class="row" style="align-items:center"><label><input type="checkbox" style="width:auto" ${o.off?'checked':''} onchange="ed('${x.id}','off',this.checked)"> Hide</label><label><input type="checkbox" style="width:auto" ${o.so?'checked':''} onchange="ed('${x.id}','so',this.checked)"> Sold out</label>${c.id=='deals'?`<label><input type="checkbox" style="width:auto" ${o.ns?'':'checked'} onchange="ed('${x.id}','ns',!this.checked)"> 🎞 Show in top slider</label>`:''}<button class="btn g" style="flex:0 0 auto" onclick="rem('${x.id}')">🗑 Remove item</button></div></div>`}).join('')+
  (gone.length?`<div class="lab" style="margin-top:12px">Removed items:</div>`+gone.map(x=>`<div class="row" style="align-items:center"><span class="lab" style="flex:2">${esc((o0.items[x.id]||{}).n||x.n)}</span><button class="btn g" style="flex:0 0 auto" onclick="restore('${x.id}')">Restore</button></div>`).join(''):'')+
  `<div style="border-top:2px solid #eee;margin-top:12px;padding-top:10px"><b class="lab">➕ Add new item to ${esc(title)}</b><input id="nn_${c.id}" placeholder="Item name" style="margin-top:6px"><input id="nd_${c.id}" placeholder="Details - what is included (optional)" style="margin-top:6px"><div class="row"><input id="np_${c.id}" type="number" min="0" placeholder="Price"></div><div class="row" style="align-items:center"><label class="lab" style="flex:2;min-width:150px">📷 Photo (optional)${c.id=='deals'?' - it will also play in the top slider':''}<input id="nf_${c.id}" type="file" accept="image/*"></label><button class="btn" style="flex:0 0 auto" onclick="addi('${c.id}')">Add item</button></div></div></div>`}).join('')+
 `<div class="card"><b>➕ Add a new section</b><div class="row"><input id="ns" maxlength="40" placeholder="Section name (e.g. Ramzan Deals)" style="flex:2"><button class="btn" style="flex:0 0 auto" onclick="addsec()">Add section</button></div></div>`}
function bnCard(){const B=D.o.bn||[];return `<div class="card" id="bncard"><b>🖼 Slider banners (Eid, Ramzan, announcements)</b><p class="lab">These photos play in the top slider on your menu, before the deals. Best size: wide photo (16:9). Caption is optional. Press <b>Save changes</b> after editing captions or order.</p>
 <label class="lab" style="display:block;margin-top:6px">Slider heading<input value="${esc(D.o.slt||'')}" placeholder="🔥 Hot Deals" maxlength="40" onchange="D.o.slt=this.value.trim().slice(0,40)"></label>`+
 B.map((b,i)=>`<div style="border-top:1px solid #eee;margin-top:8px;padding-top:8px"><div class="row" style="align-items:center">${b.iv?`<img src="/api/img?id=${b.id}&v=${b.iv}" alt="" style="max-width:120px;border-radius:6px;flex:0 0 auto">`:'<span class="lab" style="flex:0 0 auto">No photo yet</span>'}<input value="${esc(b.t||'')}" maxlength="120" placeholder="Caption (optional) e.g. Eid Mubarak!" onchange="bnT('${b.id}',this.value)" style="flex:2"></div>
 <div class="row" style="align-items:center"><label class="btn g" style="text-align:center;cursor:pointer;flex:0 0 auto">📷 ${b.iv?'Change':'Add'} photo<input type="file" accept="image/*" hidden onchange="pic('${b.id}',this)"></label><label><input type="checkbox" style="width:auto" ${b.off?'':'checked'} onchange="bnOn('${b.id}',this.checked)"> Show</label><button class="btn g" style="flex:0 0 auto" ${i?'':'disabled'} onclick="bnMv('${b.id}',-1)" aria-label="Move earlier">↑</button><button class="btn g" style="flex:0 0 auto" ${i<B.length-1?'':'disabled'} onclick="bnMv('${b.id}',1)" aria-label="Move later">↓</button><button class="btn g" style="flex:0 0 auto" onclick="bnDel('${b.id}')">🗑 Delete</button></div></div>`).join('')+
 `<div class="row" style="margin-top:10px"><label class="lab" style="flex:2;min-width:150px">New banner photo<input id="bnf" type="file" accept="image/*"></label><button class="btn" style="flex:0 0 auto" onclick="bnAdd()">➕ Add banner</button></div></div>`}
function bnAdd(){const f=$('bnf');if(!f.files[0])return toast('Choose a photo first');D.o.bn=D.o.bn||[];if(D.o.bn.length>=10)return toast('Banner limit reached (10)');const id='b'+Date.now().toString(36);D.o.bn.push({id,t:''});menu();pic(id,f)}
function bnT(id,v){bn(id).t=v.trim().slice(0,120)}
function bnOn(id,b){bn(id).off=!b}
function bnMv(id,d){const B=D.o.bn,i=B.findIndex(x=>x.id==id),j=i+d;if(j<0||j>=B.length)return;[B[i],B[j]]=[B[j],B[i]];menu()}
async function bnDel(id){if(!confirm('Delete this banner?'))return;try{await fetch('/api/img?id='+id,{method:'DELETE',headers:{'x-admin-key':K}})}catch(e){}D.o.bn=D.o.bn.filter(x=>x.id!=id);const r=await api('PUT','/api/menu',D);toast(r.ok?'Banner deleted':'Press Save changes');menu()}
function secT(id,v){v=v.trim();const s=(D.o.sec||[]).find(x=>x.id==id);if(s){if(v)s.t=v.slice(0,40)}else if(v)D.o.st[id]=v.slice(0,40);else delete D.o.st[id]}
function secH(id,b){D.o.hs[id]=b}
function delsec(id){if(!confirm('Delete this section and all items you added to it?'))return;D.o.sec=D.o.sec.filter(x=>x.id!=id);D.o.custom=D.o.custom.filter(x=>x.c!=id);menu()}
function rem(id){if(!confirm('Remove this item from the menu?'))return;if(cu(id))D.o.custom=D.o.custom.filter(x=>x.id!=id);else it(id).rm=true;menu()}
function restore(id){delete it(id).rm;menu()}
function addsec(){const n=$('ns').value.trim();if(!n)return toast('Enter a section name');if(D.o.sec.length>=20)return toast('Section limit reached');D.o.sec.push({id:'s'+Date.now().toString(36),t:n.slice(0,40)});menu();toast('Section added. Add items, then press Save changes.')}
function shrink(f,mw){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('This photo format is not supported (HEIC?). Please pick a JPG or PNG photo.'))};im.onload=()=>{let w=Math.min(mw||800,im.width),q=.82;for(let i=0;i<8;i++){const h=Math.max(1,Math.round(im.height*w/im.width)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let d=c.toDataURL('image/webp',q);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q);if(d.length<=350000){URL.revokeObjectURL(u);return ok(d)}w=Math.round(w*.8);q=Math.max(.5,q-.06)}URL.revokeObjectURL(u);no(new Error('Photo is too large'))};im.src=u})}
async function pic(id,inp){const f=inp.files[0];if(!f)return;toast('Uploading photo...');
 try{const d=await shrink(f,bn(id)?1200:800);let r;try{r=await fetch('/api/img?id='+encodeURIComponent(id),{method:'PUT',headers:{'x-admin-key':K,'content-type':'text/plain'},body:d})}catch(e){throw new Error('No connection')}
  if(!r.ok){let m='';try{m=(await r.json()).error||''}catch(e){}
   throw new Error(r.status==401?'Wrong password. Log out and log in again.':r.status==404||r.status==405?'Server is missing the photo function. Re-upload netlify/functions/menu.mjs to GitHub and redeploy.':'Server error '+r.status+(m?': '+m:''))}
  (cu(id)||bn(id)||it(id)).iv=Date.now();const r2=await api('PUT','/api/menu',D);toast(r2.ok?'Photo saved':'Photo uploaded, press Save changes');menu()}catch(e){toast('Photo not uploaded: '+(e&&e.message||'unknown error'));inp.value=''}}
async function unpic(id){if(!confirm('Go back to the original photo?'))return;try{await fetch('/api/img?id='+id,{method:'DELETE',headers:{'x-admin-key':K}})}catch(e){}
 delete (cu(id)||bn(id)||it(id)).iv;const r=await api('PUT','/api/menu',D);toast(r.ok?'Original photo restored':'Press Save changes');menu()}
function addi(c){const n=$('nn_'+c).value.trim(),d=$('nd_'+c).value.trim(),pv=$('np_'+c).value,p=+pv;if(!n||pv===''||!(p>=0))return toast('Enter a name and price');
 if(D.o.custom.length>=200)return toast('Item limit reached');const id='c'+Date.now().toString(36),fi=$('nf_'+c);D.o.custom.push({id,c,n:n.slice(0,80),d:d.slice(0,200),p});
 if(fi&&fi.files[0]){menu();pic(id,fi)}else{menu();toast('Item added. Press Save changes (you can add its photo with Change photo).')}}
function sets(){const s=D.s;$('v').innerHTML=`<div class="card"><label class="lab">WhatsApp number for orders (with 92, no + or 0)<input id="wa" value="${esc(s.wa||'923093006072')}"></label>
 <div class="row"><label class="lab">Minimum delivery order (Rs.)<input id="md" type="number" value="${s.minDel??800}"></label><label class="lab">Delivery charge (Rs.)<input id="fe" type="number" value="${s.fee??0}"></label></div>
 <label class="lab">Announcement on top of the menu (leave empty to hide)<input id="bn" maxlength="120" value="${esc(s.banner||'')}"></label>
 <label style="display:block;margin-top:10px"><input id="op" type="checkbox" style="width:auto" ${s.open===false?'':'checked'}> Accepting orders (untick to close the shop now)</label></div>`}
async function save(){if(T==2){D.s={wa:$('wa').value.trim(),minDel:+$('md').value||0,fee:+$('fe').value||0,banner:$('bn').value.trim(),open:$('op').checked}}
 const r=await api('PUT','/api/menu',D);toast(r.ok?'Saved. Customers see it within a minute.':'Could not save: '+((await r.json().catch(()=>({}))).error||r.status))}
let IP=null;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;$('ins').style.display=''});
addEventListener('appinstalled',()=>{IP=null;$('ins').style.display='none'});
if(ios&&!stand)$('ins').style.display='';
async function inst(){if(IP){IP.prompt();await IP.userChoice;IP=null;$('ins').style.display='none'}else alert('iPhone: Safari mein Share button dabayen, phir "Add to Home Screen" chunein.')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
if(K)go();
</script></body></html>
